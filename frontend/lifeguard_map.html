<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifeguard Stand Notifications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        #container {
            display: flex;
            height: 100vh;
            position: relative; /* Added for absolute positioning */
        }
        #image-container {
            flex: 1;
            position: relative; /* Added for absolute positioning */
        }
        #image-container img {
            max-width: 100%;
            max-height: 100%;
            display: block; /* Fix for default image display behavior */
        }
        .stand-marker {
            position: absolute;
            font-size: 20px; /* Adjust icon size as needed */
            color: green; /* Default color for markers */
        }
        .stand-marker.alert {
            color: red; /* Color for alert markers */
        }
        #notifications-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        #footer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="image-container">
            <img src="NSB.png" alt="NSB Image">
            <!-- Lifeguard stand markers will be dynamically added here -->
            <div class="stand-marker" id="stand-8" style="top: 25px; left: 185px;"><i class="fas fa-umbrella-beach"></i></div>
            <div class="stand-marker" id="stand-7" style="top: 100px; left: 220px;"><i class="fas fa-umbrella-beach"></i></div>
            <div class="stand-marker" id="stand-6" style="top: 175px; left: 250px;"><i class="fas fa-umbrella-beach"></i></div>
            <div class="stand-marker" id="stand-5" style="top: 250px; left: 290px;"><i class="fas fa-umbrella-beach"></i></div>
            <div class="stand-marker" id="stand-4" style="top: 325px; left: 330px;"><i class="fas fa-umbrella-beach"></i></div>
            <div class="stand-marker" id="stand-3" style="top: 400px; left: 360px;"><i class="fas fa-umbrella-beach"></i></div>
            <div class="stand-marker" id="stand-2" style="top: 475px; left: 400px;"><i class="fas fa-umbrella-beach"></i></div>
            <div class="stand-marker" id="stand-1" style="top: 550px; left: 450px;"><i class="fas fa-umbrella-beach"></i></div>
            <!-- Add more stand markers as needed -->
        </div>
        <div id="notifications-container">
            <div id="title">Lifeguard Stand Notifications</div>
            <div id="notifications">
                <!-- Notifications will be dynamically added here -->
            </div>
        </div>
    </div>
    <div id="footer">Created by Lukas DeLoach</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            // Function to fetch notifications from the server
            var currentStand = 0;
            function fetchNotifications() {
                $.ajax({
                    url: 'notification.txt',
                    type: 'GET',
                    success: function(data) {
                        // Split data into lines
                        var lines = data.split('\n');
                        var notifications = {};
                        // Iterate over each line
                        lines.forEach(function(line) {
                            // Split line into parts
                            var parts = line.split(', ');
                            var name = parts[0];
                            var lat = parts[1];
                            var lng = parts[2];
                            var distance = parts[3];
                            // Create notification object
                            notifications[name] = {lat: lat, lng: lng, distance: distance};
                        });
                        // Update notifications if there are changes
                        updateNotifications(notifications);
                    },
                    error: function(xhr, status, error) {
                        console.error('Error fetching notifications:', error);
                    }
                });
            }

            // Function to update notifications
            function updateNotifications(newNotifications) {
                // Get existing notifications
                var existingNotifications = $('#notifications').children();
                // Compare with new notifications
                for (var name in newNotifications) {
                    var isNew = true;
                    existingNotifications.each(function() {
                        if ($(this).text().includes(name)) {
                            isNew = false;
                            return false; // Exit loop if found
                        }
                    });
                    if (isNew) {
                        var notificationText = 'Shark detected at ' + name + ', Lat: ' + newNotifications[name].lat + ', Lng: ' + newNotifications[name].lng + ', distance from stand: ' + Math.ceil(newNotifications[name].distance.split(' ')[0]*1000) + ' m, time: ' + new Date();
                        $('#notifications').append('<div>' + notificationText + '</div>');
                        // Alert the corresponding stand marker
                        $('#stand-' + currentStand).removeClass('alert');
                        $('#stand-' + name.split(' ')[1]).addClass('alert');
                        currentStand = name.split(' ')[1]
                    }
                }
            }

            // Fetch notifications every 1 second
            setInterval(fetchNotifications, 500);
        });
    </script>
</body>
</html>
